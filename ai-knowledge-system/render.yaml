services:
  - type: web
    name: ai-knowledge-backend
    runtime: python
    rootDir: ai-knowledge-system/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./knowledge_base.db
      - key: FETCH_INTERVAL_HOURS
        value: "4"
      - key: GROQ_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
