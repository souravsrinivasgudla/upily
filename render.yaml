# Render Blueprint for the Upily API.
# The service name is kept as-is so re-syncing the blueprint updates the existing
# service (and its URL, which frontend/vercel.json points at) instead of creating a new one.
services:
  - type: web
    name: ai-knowledge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: groq
      - key: FETCH_INTERVAL_HOURS
        value: "4"
      # Secrets — set these in the Render dashboard (sync: false = not stored in git)
      - key: DATABASE_URL        # Postgres, e.g. Neon. Render's disk is wiped on every deploy.
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
