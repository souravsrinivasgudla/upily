# Render Blueprint for the Upily API (New > Blueprint > pick this repo).
services:
  - type: web
    name: upily-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: groq
      - key: FETCH_INTERVAL_HOURS
        value: "4"
      - key: ADMIN_API_KEY
        generateValue: true
      # You are prompted for these when creating the Blueprint (sync: false = not stored in git)
      - key: DATABASE_URL        # Postgres (e.g. Neon). Render's disk is wiped on every deploy.
        sync: false
      - key: CORS_ORIGINS        # your Vercel URL, e.g. https://upily.vercel.app
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
