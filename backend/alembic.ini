# Alembic configuration for Upily.
# The database URL comes from the app settings (DATABASE_URL / backend/.env), not from here.
#
#   alembic upgrade head                        apply all migrations
#   alembic revision --autogenerate -m "msg"    create a migration from model changes
#   alembic downgrade -1                        roll back the last migration
#
# The app also runs `upgrade head` automatically on startup (db/database.py:init_db).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
