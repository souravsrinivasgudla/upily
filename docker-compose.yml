# Local PostgreSQL for Upily.
#
#   docker compose up -d        start (data persists in the `upily-pgdata` volume)
#   docker compose down         stop   (add -v to also delete the data)
#
# Credentials come from the repo-root .env (gitignored); see .env.example.
# The app creates its tables itself on startup via Alembic.
services:
  postgres:
    image: postgres:16-alpine
    container_name: upily-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repo-root .env}
      POSTGRES_DB: ${POSTGRES_DB:-upily}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # localhost only — not exposed to your network
    volumes:
      - upily-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  upily-pgdata:
